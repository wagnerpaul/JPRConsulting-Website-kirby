# Same compose project as staging (see docker-compose.yml).
name: jprconsulting-website-kirby

version: '2'

volumes:
  content:
    external: true
    name: ${SLD}-prod-content
  media:
    external: true
    name: ${SLD}-prod-media
  sessions:
    external: true
    name: ${SLD}-prod-sessions
  accounts:
    external: true
    name: ${SLD}-accounts
  cache:
    external: true
    name: ${SLD}-prod-cache
services:
  prod:
    #no build directive to prevent accidental builds
    #use: build: .
    image: wagnerpaul/${SLD}-main-app:latest
    volumes:
      - content:/app/content
      - media:/app/public/media
      - cache:/app/storage/cache
      - sessions:/app/storage/sessions
      - accounts:/app/storage/accounts
    environment:
      SERVER_NAME: ${SLD}.${TLD}  #one canonical for nginx file
      VIRTUAL_HOST: www.${SLD}.${TLD}, ${SLD}.${TLD} #redirectable list with canonical last for jwilder
      ENABLE_PANEL: 'false'
      ENABLE_PW: 'false'
      LETSENCRYPT_HOST: www.${SLD}.${TLD}, ${SLD}.${TLD}
      LETSENCRYPT_EMAIL: jeremy@korb.studio
      # app secrets and settings from the 1Password Environment (.env)
      EMAIL_TRANSPORT_HOST: ${EMAIL_TRANSPORT_HOST}
      EMAIL_TRANSPORT_USERNAME: ${EMAIL_TRANSPORT_USERNAME}
      EMAIL_TRANSPORT_PASSWORD: ${EMAIL_TRANSPORT_PASSWORD}
      WEBHOOKS_ENDPOINT: ${WEBHOOKS_ENDPOINT}
      DEPLOY_CONTENT_HOOK: ${DEPLOY_CONTENT_HOOK}
      DEPLOY_CONTENT_KEY: ${DEPLOY_CONTENT_KEY}
    container_name: ${SLD}-prod
    restart: always

networks:
  default:
    external:
      name: proxy-network
