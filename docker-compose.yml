version: '2'

volumes:
  content:
    external: true
    name: ${SLD}-stg-content
  content-prod:
    external: true
    name: ${SLD}-prod-content
  media:
    external: true
    name: ${SLD}-stg-media
  sessions:
    external: true
    name: ${SLD}-stg-sessions
  accounts:
    external: true
    name: ${SLD}-accounts
  cache-prod:
    external: true
    name: ${SLD}-prod-cache
  # duplicity chain metadata; persisting it across recreates saves the
  # backup a full re-sync from B2 (one cache per backup container)
  backup-cache-content:
    name: ${SLD}-backup-cache-content-stg
  backup-cache-accounts:
    name: ${SLD}-backup-cache-accounts-stg
services:
  stg:
    build: .
    image: wagnerpaul/${SLD}-main-app:stg
    volumes:
      - content:/app/content
      - content-prod:/app/content-prod
      - media:/app/public/media
      - cache-prod:/app/storage-prod/cache
      - sessions:/app/storage/sessions
      - accounts:/app/storage/accounts
    environment:
      SERVER_NAME: stg.${SLD}.${TLD}
      VIRTUAL_HOST: stg.${SLD}.${TLD}
      ENABLE_PANEL: 'true'
      ENABLE_PW: 'true'
      LETSENCRYPT_HOST: stg.${SLD}.${TLD}
      LETSENCRYPT_EMAIL: jeremy@korb.studio
    container_name: ${SLD}-stg
    restart: always
  backups-content-stg:
    image: blacklabelops/volumerize
    container_name: ${SLD}-content-backups-stg
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /postexecute/backup
        printf '%s\n' \
          'if [ "$${DUPLICITY_RETURN_CODE:-1}" -eq 0 ]; then' \
          '  echo "Pruning old backup chains; retaining $${VOLUMERIZE_RETAIN_FULL_CHAINS:-3}."' \
          '  /etc/volumerize/remove-all-but-n-full "$${VOLUMERIZE_RETAIN_FULL_CHAINS:-3}" --force' \
          'else' \
          '  echo "Backup failed; skipping retention cleanup."' \
          'fi' \
          > /postexecute/backup/retention.sh
        exec /opt/volumerize/docker-entrypoint.sh volumerize
    volumes:
      - content:/content:ro
      - backup-cache-content:/volumerize-cache
    environment:
      VOLUMERIZE_FULL_IF_OLDER_THAN: 1M
      VOLUMERIZE_RETAIN_FULL_CHAINS: 3
      VOLUMERIZE_SOURCE: /content
      VOLUMERIZE_TARGET: b2://${B2_ID}:${B2_KEY}@${B2_BUCKET}/${SLD}-backups/content-stg
  backups-accounts-stg:
    image: blacklabelops/volumerize
    container_name: ${SLD}-accounts-backups-stg
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /postexecute/backup
        printf '%s\n' \
          'if [ "$${DUPLICITY_RETURN_CODE:-1}" -eq 0 ]; then' \
          '  echo "Pruning old backup chains; retaining $${VOLUMERIZE_RETAIN_FULL_CHAINS:-3}."' \
          '  /etc/volumerize/remove-all-but-n-full "$${VOLUMERIZE_RETAIN_FULL_CHAINS:-3}" --force' \
          'else' \
          '  echo "Backup failed; skipping retention cleanup."' \
          'fi' \
          > /postexecute/backup/retention.sh
        exec /opt/volumerize/docker-entrypoint.sh volumerize
    volumes:
      - accounts:/accounts:ro
      - backup-cache-accounts:/volumerize-cache
    environment:
      VOLUMERIZE_FULL_IF_OLDER_THAN: 1M
      VOLUMERIZE_RETAIN_FULL_CHAINS: 3
      VOLUMERIZE_SOURCE: /accounts
      VOLUMERIZE_TARGET: b2://${B2_ID}:${B2_KEY}@${B2_BUCKET}/${SLD}-backups/accounts-stg
networks:
  default:
    external:
      name: proxy-network


